name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - refactor/astro

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run source and build contract
        run: pnpm run ci

      - name: Upload static site
        uses: actions/upload-artifact@v5
        with:
          name: mirror-front-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  container:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mirror-front:ci

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mirror-front:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install browser-test dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start runtime image
        id: runtime
        run: |
          docker run --detach --name mirror-front-ci \
            --publish 127.0.0.1:18080:8080 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            mirror-front:ci
          curl --fail --retry 15 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:18080/healthz

      - name: Run browser contract
        run: pnpm test:browser

      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Show runtime logs
        if: ${{ always() }}
        run: docker logs mirror-front-ci || true

      - name: Remove runtime container
        if: ${{ always() }}
        run: docker rm --force mirror-front-ci || true
