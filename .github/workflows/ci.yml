name: Build images

on:
  pull_request:
    paths-ignore:
      - 'charts/**'
      - '.github/workflows/chart.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'charts/**'
      - '.github/workflows/chart.yml'

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: mirror-front
            context: .
          - image: mirror-front-statistics-exporter
            context: ./statistics-exporter
    env:
      IMAGE_NAME: ghcr.io/zjusct/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Resolve image tag
        id: source
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.source.outputs.short }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ github.ref_name }}
          provenance: false

      - name: Clean up old images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ZJUSCT
          package: ${{ matrix.image }}
          keep-n-tagged: 10
          delete-untagged: true
