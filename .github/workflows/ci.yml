name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run source checks
        run: |
          pnpm format:check
          pnpm types-check
          pnpm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mirror-front:ci
          cache-from: type=gha,scope=mirror-front-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=mirror-front-${{ github.ref_name }}

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mirror-front:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start runtime image
        id: runtime
        run: |
          docker run --detach --name mirror-front-ci \
            --publish 127.0.0.1:18080:8080 \
            --volume "$PWD/test/nginx-drop-ins:/etc/nginx/mirror-front:ro" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            mirror-front:ci
          curl --fail --retry 15 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:18080/healthz
          test "$(curl --fail --silent \
            --header 'X-Test-Network-Mode: 2' \
            http://127.0.0.1:18080/test/nginx-drop-in)" = 2

      - name: Run browser contract
        run: pnpm test:browser

      - name: Upload browser report
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Show runtime logs
        if: ${{ failure() && !cancelled() }}
        run: docker logs mirror-front-ci || true

      - name: Remove runtime container
        if: ${{ always() }}
        run: docker rm --force mirror-front-ci || true

  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/zjusct/mirror-front
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Resolve source revision
        id: source
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read documentation revision
        id: docs
        run: echo "commit=$(jq --raw-output .commit mirrorz-docs.lock.json)" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.source.outputs.short }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.zjusct.mirror-front.mirrorz-docs-revision=${{ steps.docs.outputs.commit }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=mirror-front-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=mirror-front-${{ github.ref_name }}
          provenance: false

      - name: Clean up old images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ZJUSCT
          package: mirror-front
          keep-n-tagged: 10
          delete-untagged: true
