name: Build mirror-front

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: mirror-front-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mirror-front
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/zjusct/mirror-front
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Resolve image tag
        id: source
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read mirrorz-docs gitlink
        id: docs
        run: |
          commit=$(node scripts/mirrorz-docs-source.mjs)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            MIRRORZ_DOCS_COMMIT=${{ steps.docs.outputs.commit }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.source.outputs.short }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=mirror-front-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=mirror-front-${{ github.ref_name }}
          provenance: false

      - name: Clean up old images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ZJUSCT
          package: mirror-front
          keep-n-tagged: 10
          delete-untagged: true
