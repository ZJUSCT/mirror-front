include /etc/nginx/mirror-front/http.d/*.conf;

# Browser navigations advertise HTML and receive the client-rendered shell.
# The shell's listing request, curl, wget, and other API consumers receive the
# built-in autoindex JSON response. The relative sentinel must not exist: it
# makes ngx_http_index_module decline so ngx_http_autoindex_module can run.
map $http_accept $autoindex_index {
    "~*text/html"  /autoindex/index.html;
    default        .no-autoindex-shell;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;

    # Preserve normal Astro pages, then negotiate directories that do not
    # contain an index.html (for example, a mounted mirror tree).
    index index.html $autoindex_index;

    # Keep directory redirects relative when this container is behind a
    # gateway; otherwise nginx can leak its internal port in Location.
    absolute_redirect off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: https://github.com https://avatars.githubusercontent.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Vary "Accept" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    include /etc/nginx/mirror-front/server.d/*.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header Cache-Control "public, immutable";
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Unlike mounted mirror directories, /autoindex/ contains the shell as its
    # own index.html. Skip that normal index here so its JSON branch remains
    # reachable at the same URL.
    location = /autoindex/ {
        index $autoindex_index;
        autoindex on;
        autoindex_format json;
        log_not_found off;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Vary "Accept" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # The dynamic index above internally redirects HTML requests here. Keep
    # Vary on the final response so shared caches do not serve HTML to JSON
    # consumers (or vice versa).
    location = /autoindex/index.html {
        try_files $uri =404;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Vary "Accept" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        autoindex on;
        autoindex_format json;
        log_not_found off;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;
}
