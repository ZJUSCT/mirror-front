include /etc/nginx/mirror-front/http.d/*.conf;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;

    # Preserve normal Astro pages, then serve the shared directory shell.
    index index.html /autoindex/index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/markdown text/plain application/json application/javascript text/css image/svg+xml;

    # Keep directory redirects relative when this container is behind a
    # gateway; otherwise nginx can leak its internal port in Location.
    absolute_redirect off;

    # Serve plain HTTP for mirror clients; do not force browser HTTPS upgrades.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: https://github.com https://avatars.githubusercontent.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    include /etc/nginx/mirror-front/server.d/*.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Markdown endpoints are build artifacts, never directory-listing shells.
    location ~ ^/docs/[^/]+\.md$ {
        types { text/markdown md; }
        charset utf-8;
        charset_types text/markdown;
        try_files $uri =404;
    }

    location = /llms.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "public, immutable";
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Demo API for a mounted mirror tree. Production publishers add the
    # snapshot-scoped response cache in their own NGINX configuration.
    location ~ ^/([^/]+)/\.mirror-index/(.*)$ {
        if ($uri !~ /$) { return 404; }
        rewrite ^/([^/]+)/\.mirror-index/(.*)$ /$1/$2 break;
        index .no-autoindex-shell;
        autoindex on;
        autoindex_format json;
        log_not_found off;
    }

    location = /autoindex/index.html {
        try_files $uri =404;
        expires -1;
    }

    location / {
        log_not_found off;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;
}
