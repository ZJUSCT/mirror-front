{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mirror-front.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mirror-front.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "httpRoute.parentRefs is required when httpRoute.enabled=true" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  hostnames:
    {{- required "httpRoute.hostnames is required when httpRoute.enabled=true" .Values.httpRoute.hostnames | toYaml | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "mirror-front.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
