{{- if .Values.statistics.enabled }}
{{- if not (has .Values.statistics.auth.mode (list "basic" "token")) }}
{{- fail "statistics.auth.mode must be basic or token" }}
{{- end }}
{{- $_ := required "statistics.config.panels is required when statistics.enabled=true" .Values.statistics.config.panels }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mirror-front.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mirror-front.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "mirror-front.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mirror-front.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        kubectl.kubernetes.io/default-container: static-server
        {{- if or .Values.nginx.http .Values.nginx.server .Values.statistics.enabled }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: static-server
          image: {{ include "mirror-front.image" (dict "image" .Values.image "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if or .Values.nginx.http .Values.nginx.server .Values.statistics.enabled }}
            - name: nginx-config
              mountPath: /etc/nginx/mirror-front
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.nginx.tmpSizeLimit }}
        {{- if or .Values.nginx.http .Values.nginx.server .Values.statistics.enabled }}
        - name: nginx-config
          configMap:
            name: {{ include "mirror-front.configName" . }}
            items:
              {{- range $name, $_ := .Values.nginx.http }}
              - key: {{ printf "http-%s" $name | quote }}
                path: {{ printf "http.d/%s" $name | quote }}
              {{- end }}
              {{- range $name, $_ := .Values.nginx.server }}
              - key: {{ printf "server-%s" $name | quote }}
                path: {{ printf "server.d/%s" $name | quote }}
              {{- end }}
              {{- if .Values.statistics.enabled }}
              - key: server-statistics-proxy.conf
                path: server.d/statistics-proxy.conf
              {{- end }}
        {{- end }}
