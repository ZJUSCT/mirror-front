  <path class="cloud" d="M631 245c-4-26 17-48 43-45 12-26 53-22 59 8 27-4 42 31 20 46 11 28-26 48-48 30-21 23-59 10-61-18-8-3-12-11-13-21Z" transform="translate(-42 0)" />
