<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title description">
  <title id="title">新镜像站基础设施</title>
  <desc id="description">三台存储节点和两台业务节点通过万兆交换机连接互联网。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#456c99" />
    </marker>
    <style>
      text { font-family: Arial, "Noto Sans CJK SC", sans-serif; fill: #17202b; text-anchor: middle }
      .title { font-size: 28px; font-weight: 700 }
      .meta { font-size: 14px; fill: #5b6570 }
      .node { fill: #f7f9fc; stroke: #6d88a8; stroke-width: 2 }
      .node-title { font-size: 16px; font-weight: 700 }
      .node-detail { font-size: 12px; fill: #465261 }
      .link { fill: none; stroke: #456c99; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow) }
      .link-label { font-size: 12px; fill: #456c99; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round }
      .cloud { fill: #e7f1fb; stroke: #456c99; stroke-width: 2 }
    </style>
  </defs>

  <rect width="720" height="520" fill="#fff" />

  <text class="title" x="360" y="38">新镜像站基础设施</text>
  <text class="meta" x="360" y="66">位置：浙江大学紫金港校区和同苑 5 幢化四 221 G6 机柜</text>
  <text class="meta" x="360" y="89">上次更新：2025 年 04 月 19 日</text>

  <rect class="node" x="115" y="125" width="150" height="68" rx="4" />
  <text class="node-title" x="190" y="151">业务节点</text>
  <text class="node-detail" x="190" y="176">H3C R4900 G3</text>

  <rect class="node" x="455" y="125" width="150" height="68" rx="4" />
