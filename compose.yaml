services:
  dev:
    image: mirror-front-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
        NODE_VERSION: '22'
        PNPM_VERSION: 10.15.1
    init: true
    ports:
      - '4321:4321'
    volumes:
      - .:/app
      - dev-node-modules:/app/node_modules
      - dev-pnpm-store:/pnpm/store
      - dev-astro:/app/.astro
      - dev-cache:/app/.cache
      - dev-dist:/app/dist

  preview:
    build:
      context: .
      args:
        DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-production}
    image: mirror-front:preview
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - '0.0.0.0:8080:8080'
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m

volumes:
  dev-node-modules:
  dev-pnpm-store:
  dev-astro:
  dev-cache:
  dev-dist:
