services:
  dev:
    image: mirror-front-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
        NODE_VERSION: '22'
        PNPM_VERSION: 10.15.1
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    init: true
    environment:
      NPM_CONFIG_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    ports:
      - '4321:4321'
    volumes:
      - .:/app
      - dev-node-modules:/app/node_modules
      - dev-pnpm-store:/pnpm/store
    tmpfs:
      - /app/.astro:rw,noexec,nosuid,nodev
      - /app/.cache:rw,noexec,nosuid,nodev
      - /app/dist:rw,noexec,nosuid,nodev

  preview:
    build:
      context: .
      args:
        DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-production}
    image: mirror-front:preview
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - '0.0.0.0:8080:8080'
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m

volumes:
  dev-node-modules:
  dev-pnpm-store:
